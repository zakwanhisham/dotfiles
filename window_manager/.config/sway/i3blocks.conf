separator=false
markup=pango

[simple-2]
full_text=|
color=#666666

[btop]
full_text=CPU:
command=alacritty -e btop

[cpu_usage]
command=~/.config/sway/scripts/cpu_usage
interval=2

[simple-2]
full_text=|
color=#666666

[memory]
label=MEM: 
command=~/.config/sway/scripts/memory
interval=2

[simple-2]
full_text=|
color=#666666

[disk]
label=DISK: 
instance=/
command=~/.config/sway/scripts/disk
interval=30

[simple-2]
full_text=|
color=#666666

[amdgpu_top]
full_text=GPU:
command=amdgpu_top --gui

[gpu_usage]
command=~/.config/sway/scripts/gpu_usage
interval=2
GPU_BRAND=AMD

[simple-2]
full_text=|
color=#666666

[network-manager]
full_text=WIFI:
command=nm-connection-editor

[iface]
command=~/.config/sway/scripts/iface
display_wifi_name=0
interval=30

[simple-2]
full_text=|
color=#666666

[pavucontrol]
full_text=VOL:
command=pavucontrol

[volume-pulseaudio]
command=~/.config/sway/scripts/volume
instance=Master
interval=1

[simple-2]
full_text=|
color=#666666

[calendar]
command=~/.config/sway/scripts/calendar
interval=1
DATEFMT=+%a-%d-%b %H:%M:%S
HEIGHT=200
WIDTH=300

[simple-2]
full_text=|
color=#666666
