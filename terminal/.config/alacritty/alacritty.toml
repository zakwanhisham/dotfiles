[general]
live_config_reload = true

[window]
dynamic_padding = true
# decorations = "None"
# startup_mode = "Maximized"

[scrolling]
history = 100000

[font]
normal = { family = "IosevkaTerm Nerd Font" }
size = 11.25
offset = { x = 0, y = 0 }

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#14161b"
foreground = "#E0E2EA"
dim_foreground = "#C4C6CD"
bright_foreground = "#E0E2EA"

[colors.cursor]
text = "#14161b"
cursor = "#E0E2EA"

[colors.vi_mode_cursor]
text = "#14161b"
cursor = "#E0E2EA"

[colors.search.matches]
foreground = "#14161b"
background = "#6b5300"

[colors.search.focused_match]
foreground = "#14161b"
background = "#fce094"

[colors.footer_bar]
foreground = "#14161b"
background = "#7EDFDE"

[colors.hints.start]
foreground = "#14161b"
background = "#E5ADB9"

[colors.hints.end]
foreground = "#14161b"
background = "#7EDFDE"

[colors.selection]
text = "#E0E2EA"
background = "#4f5258"

[colors.normal]
black = "#2c2e33"
red = "#E5ADB9"
green = "#A2DFC0"
yellow = "#E3CA85"
blue = "#95C5E5"
magenta = "#E5B6E6"
cyan = "#7EDFDE"
white = "#C4C6CD"

[colors.bright]
black = "#4f5258"
red = "#FFC0B9"
green = "#B4F6C0"
yellow = "#FCE094"
blue = "#A6DBFF"
magenta = "#FFCAFF"
cyan = "#8CF8F7"
white = "#9b9ea4"

[colors.dim]
black = "#2c2e33"
red = "#E5ADB9"
green = "#A2DFC0"
yellow = "#E3CA85"
blue = "#95C5E5"
magenta = "#E5B6E6"
cyan = "#7EDFDE"
white = "#C4C6CD"

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "Never" }

[mouse]
hide_when_typing = true
